<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Viewer — Free Online SVG Preview &amp; Code Editor</title>
    <meta
      name="description"
      content="Paste SVG code and preview it instantly. Free online SVG viewer with a live side-by-side editor — no upload, no signup, runs in your browser."
    />
    <meta
      name="keywords"
      content="SVG viewer, SVG preview, online SVG editor, view SVG code, SVG renderer, free SVG tool"
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="SVGViewer" />
    <meta name="theme-color" content="#061018" />
    <link rel="canonical" href="https://your-domain.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SVGViewer" />
    <meta property="og:title" content="SVG Viewer — Free Online SVG Preview &amp; Code Editor" />
    <meta
      property="og:description"
      content="Paste SVG code and preview it instantly. Free online SVG viewer with a live side-by-side editor."
    />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://your-domain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SVGViewer — paste SVG code on the left, see the preview on the right" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SVG Viewer — Free Online SVG Preview &amp; Code Editor" />
    <meta
      name="twitter:description"
      content="Paste SVG code and preview it instantly. Free online SVG viewer with a live side-by-side editor."
    />
    <meta name="twitter:image" content="https://your-domain.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SVGViewer",
        "alternateName": "SVG Viewer",
        "url": "https://your-domain.com/",
        "description": "Paste SVG code and preview it instantly. Free online SVG viewer with a live side-by-side editor — no upload, no signup, runs in your browser.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern browser with JavaScript enabled",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Live SVG preview",
          "Side-by-side code editor",
          "Runs entirely in the browser",
          "No account required"
        ]
      }
    </script>
  </head>
  <body>
    <div class="ambiance" aria-hidden="true">
      <div class="ambiance-wash"></div>
      <div class="ambiance-glow ambiance-glow-a"></div>
      <div class="ambiance-glow ambiance-glow-b"></div>
      <div class="ambiance-glow ambiance-glow-c"></div>
      <div class="ambiance-beam"></div>
      <div class="ambiance-grid"></div>
      <div class="ambiance-noise"></div>
      <div class="ambiance-vignette"></div>
    </div>

    <a class="skip-link" href="#editor">Skip to SVG editor</a>

    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="32" height="32" fill="none">
            <defs>
              <linearGradient id="brand-plate" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
                <stop stop-color="#0B1B33" />
                <stop offset="0.55" stop-color="#102A4A" />
                <stop offset="1" stop-color="#0E3A5C" />
              </linearGradient>
              <linearGradient id="brand-ring" x1="8" y1="7" x2="24" y2="25" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7DD3FC" />
                <stop offset="0.45" stop-color="#38BDF8" />
                <stop offset="1" stop-color="#2563EB" />
              </linearGradient>
              <linearGradient id="brand-core" x1="12" y1="11" x2="21" y2="22" gradientUnits="userSpaceOnUse">
                <stop stop-color="#F0F9FF" />
                <stop offset="1" stop-color="#BAE6FD" />
              </linearGradient>
            </defs>
            <rect width="32" height="32" rx="9" fill="url(#brand-plate)" />
            <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8.25" stroke="#67E8F9" stroke-opacity="0.22" />
            <circle cx="16" cy="16" r="10.25" stroke="url(#brand-ring)" stroke-width="1.75" />
            <circle cx="16" cy="16" r="6.6" stroke="#E0F2FE" stroke-opacity="0.35" stroke-width="1" />
            <path
              d="M16 9.2c3.2 2.1 5.1 4.2 5.1 6.8S19.2 20.7 16 22.8C12.8 20.7 10.9 18.6 10.9 16S12.8 11.3 16 9.2Z"
              fill="url(#brand-core)"
            />
            <circle cx="16" cy="16" r="2.15" fill="#0284C7" />
            <circle cx="16" cy="16" r="0.95" fill="#F0F9FF" />
            <circle cx="22.8" cy="10.2" r="1.35" fill="#38BDF8" />
            <circle cx="9.4" cy="20.6" r="1.05" fill="#7DD3FC" fill-opacity="0.85" />
          </svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-name">SVGViewer</h1>
          <p class="brand-tagline">Code in · vector out</p>
        </div>
      </div>
      <div class="header-meta">
        <span class="meta-chip">Live</span>
        <span class="meta-chip meta-chip-quiet">Local</span>
      </div>
    </header>

    <main class="workspace" id="tool">
      <section class="panel panel-editor" aria-labelledby="editor-heading">
        <div class="panel-bar">
          <div class="panel-bar-left">
            <span class="window-dots" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
            <p id="editor-heading" class="panel-title">Source</p>
          </div>
          <div class="panel-actions">
            <button type="button" class="btn btn-ghost" id="btn-clear" title="Clear editor">
              Clear
            </button>
          </div>
        </div>
        <label class="sr-only" for="editor">SVG markup</label>
        <textarea
          id="editor"
          class="editor"
          spellcheck="false"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          wrap="off"
          aria-describedby="editor-hint"
          placeholder="Paste your SVG markup here…"
        ></textarea>
        <p id="editor-hint" class="sr-only">
          Type or paste SVG markup. The preview on the right updates as you type.
        </p>
      </section>

      <section class="panel panel-preview" aria-labelledby="preview-heading">
        <div class="panel-bar panel-bar-light">
          <div class="panel-bar-left">
            <p id="preview-heading" class="panel-title">Live preview</p>
          </div>
          <p class="preview-status" id="preview-status" aria-live="polite">Ready</p>
        </div>
        <div class="preview-stage" id="preview-stage">
          <div class="preview-canvas" id="preview-canvas" role="img" aria-label="Rendered SVG preview"></div>
          <p class="preview-empty" id="preview-empty" hidden>Your SVG preview will appear here.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
