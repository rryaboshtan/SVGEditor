<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">SVG source code flowing into a live preview</title>
  <desc id="desc">A dark code panel connects to a light vector preview panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#071526"/>
      <stop offset="1" stop-color="#0e3a5c"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" rx="18" fill="url(#bg)"/>
  <rect x="36" y="52" width="300" height="250" rx="12" fill="#040c16" stroke="#38bdf8" stroke-opacity=".35"/>
  <text x="62" y="86" fill="#9fb6d1" font-family="monospace" font-size="16">SVG SOURCE</text>
  <text x="62" y="132" fill="#fb7185" font-family="monospace" font-size="18">&lt;svg</text>
  <text x="118" y="132" fill="#fdba74" font-family="monospace" font-size="18">viewBox=</text>
  <text x="220" y="132" fill="#5eead4" font-family="monospace" font-size="18">"0 0 120 80"</text>
  <text x="62" y="170" fill="#fb7185" font-family="monospace" font-size="18">&lt;path</text>
  <text x="135" y="170" fill="#fdba74" font-family="monospace" font-size="18">d=</text>
  <text x="170" y="170" fill="#5eead4" font-family="monospace" font-size="18">"M12 60"</text>
  <text x="62" y="208" fill="#fb7185" font-family="monospace" font-size="18">/&gt;</text>
  <text x="62" y="262" fill="#67e8f9" font-family="monospace" font-size="14">edit - inspect - export</text>
  <path d="M370 178h140" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
  <path d="m495 163 18 15-18 15" fill="none" stroke="#a5f3fc" stroke-width="4"/>
  <rect x="552" y="52" width="312" height="250" rx="12" fill="#f8fbff" stroke="#67e8f9" stroke-opacity=".55"/>
  <text x="578" y="86" fill="#1e3a5f" font-family="sans-serif" font-size="16" font-weight="700">LIVE VECTOR PREVIEW</text>
  <path d="M610 235 706 110l110 125H610Z" fill="#38bdf8" fill-opacity=".72"/>
  <circle cx="706" cy="150" r="42" fill="#22d3ee" fill-opacity=".72"/>
  <path d="M640 235h130" stroke="#1e3a5f" stroke-width="7" stroke-linecap="round"/>
</svg>
