<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Dark UI icons: hard-coded black vs currentColor</title>
  <desc id="desc">Before: black icon nearly invisible on dark UI. After: cyan currentColor icon clearly visible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="100%" stop-color="#0B1B33"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C1828"/>
      <stop offset="100%" stop-color="#07111C"/>
    </linearGradient>
    <linearGradient id="plate" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071526"/>
      <stop offset="1" stop-color="#0E3A5C"/>
    </linearGradient>
    <linearGradient id="bracket" x1="6" y1="7" x2="26" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="640" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" fill="#8EB4D4" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3">DARK UI ICONS</text>

  <!-- BEFORE card -->
  <rect x="48" y="84" width="528" height="500" rx="20" fill="url(#card)" stroke="#7DD3FC" stroke-opacity="0.18"/>
  <text x="72" y="128" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">BEFORE</text>

  <!-- mini brand + nav mock -->
  <rect x="72" y="152" width="480" height="56" rx="12" fill="#041018" stroke="#1E3A5F"/>
  <g transform="translate(88, 164) scale(1.0)">
    <rect width="32" height="32" rx="8" fill="url(#plate)"/>
    <path d="M10.2 8.2L5.4 16L10.2 23.8" fill="none" stroke="url(#bracket)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21.8 8.2L26.6 16L21.8 23.8" fill="none" stroke="url(#bracket)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="3.85" fill="none" stroke="#7DD3FC" stroke-width="1.4"/>
    <circle cx="16" cy="16" r="1.85" fill="#F0F9FF"/>
  </g>
  <text x="132" y="186" fill="#9FB6D1" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">SVGEditor</text>
  <!-- black icon nearly invisible -->
  <g transform="translate(252, 280)" opacity="0.55">
    <path d="M48 8L8 28l40 20 40-20z" fill="#000000"/>
    <path d="M8 48l40 20 40-20M8 68l40 20 40-20" fill="none" stroke="#000000" stroke-width="10" stroke-linejoin="round"/>
  </g>
  <text x="312" y="430" text-anchor="middle" fill="#5B7A99" font-family="ui-monospace, Menlo, monospace" font-size="18">fill="#000000"</text>
  <text x="312" y="460" text-anchor="middle" fill="#6F89A8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18">hard-coded black — almost invisible</text>

  <!-- AFTER card -->
  <rect x="624" y="84" width="528" height="500" rx="20" fill="url(#card)" stroke="#67E8F9" stroke-opacity="0.35"/>
  <text x="648" y="128" fill="#A5F3FC" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">AFTER</text>

  <rect x="648" y="152" width="480" height="56" rx="12" fill="#041018" stroke="#0EA5E9" stroke-opacity="0.45"/>
  <g transform="translate(664, 164)">
    <rect width="32" height="32" rx="8" fill="url(#plate)"/>
    <path d="M10.2 8.2L5.4 16L10.2 23.8" fill="none" stroke="url(#bracket)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21.8 8.2L26.6 16L21.8 23.8" fill="none" stroke="url(#bracket)" stroke-width="2.35" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="16" r="3.85" fill="none" stroke="#7DD3FC" stroke-width="1.4"/>
    <circle cx="16" cy="16" r="1.85" fill="#F0F9FF"/>
  </g>
  <text x="708" y="186" fill="#E8F4FF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700">SVGEditor</text>
  <g transform="translate(828, 280)">
    <path d="M48 8L8 28l40 20 40-20z" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linejoin="round"/>
    <path d="M8 48l40 20 40-20M8 68l40 20 40-20" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="888" y="430" text-anchor="middle" fill="#67E8F9" font-family="ui-monospace, Menlo, monospace" font-size="18">currentColor</text>
  <text x="888" y="460" text-anchor="middle" fill="#B6D4EF" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18">theme-aware — clear on dark UI</text>
</svg>
