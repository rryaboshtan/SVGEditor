<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">SVG sanitize pipeline</title>
  <desc id="desc">Flow from untrusted SVG markup through parse, strip, URL policy, CSP, then safe preview or share</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#0B1B33"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#38BDF8"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="url(#bg2)"/>
  <text x="56" y="64" fill="#F0F9FF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700">Defense-in-depth sanitize pipeline</text>
  <text x="56" y="100" fill="#7DD3FC" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Parse - strip active content - URL policy - CSP - preview / share</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="160" width="180" height="120" rx="14" fill="#081824" stroke="#F87171" stroke-opacity="0.5"/>
    <text x="68" y="210" fill="#FCA5A5" font-size="18" font-weight="700">Untrusted</text>
    <text x="68" y="240" fill="#94A3B8" font-size="15">paste / upload</text>
    <text x="68" y="264" fill="#94A3B8" font-size="15">/ share hash</text>

    <line x1="236" y1="220" x2="286" y2="220" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="294" y="160" width="180" height="120" rx="14" fill="#081824" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="314" y="210" fill="#7DD3FC" font-size="18" font-weight="700">DOMParser</text>
    <text x="314" y="240" fill="#94A3B8" font-size="15">image/svg+xml</text>
    <text x="314" y="264" fill="#94A3B8" font-size="15">reject junk root</text>

    <line x1="482" y1="220" x2="532" y2="220" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="540" y="160" width="180" height="120" rx="14" fill="#081824" stroke="#FBBF24" stroke-opacity="0.5"/>
    <text x="560" y="210" fill="#FCD34D" font-size="18" font-weight="700">Strip / scrub</text>
    <text x="560" y="240" fill="#94A3B8" font-size="15">tags, on*, SMIL</text>
    <text x="560" y="264" fill="#94A3B8" font-size="15">CSS / URLs</text>

    <line x1="728" y1="220" x2="778" y2="220" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="786" y="148" width="170" height="70" rx="12" fill="#081824" stroke="#34D399" stroke-opacity="0.5"/>
    <text x="806" y="190" fill="#6EE7B7" font-size="17" font-weight="700">Safe preview</text>

    <rect x="786" y="238" width="170" height="70" rx="12" fill="#081824" stroke="#67E8F9" stroke-opacity="0.45"/>
    <text x="806" y="280" fill="#A5F3FC" font-size="17" font-weight="700">Share mode</text>

    <rect x="980" y="160" width="170" height="120" rx="14" fill="#081824" stroke="#A5F3FC" stroke-opacity="0.35"/>
    <text x="1000" y="210" fill="#E0F2FE" font-size="18" font-weight="700">+ CSP</text>
    <text x="1000" y="240" fill="#94A3B8" font-size="15">script-src self</text>
    <text x="1000" y="264" fill="#94A3B8" font-size="15">defense layer</text>
  </g>

  <text x="56" y="360" fill="#64748B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Share mode also strips phishing chrome: outbound links and remote images.</text>
</svg>
