<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="title desc">
  <title id="title">SVG sanitize pipeline</title>
  <desc id="desc">Flow from untrusted SVG markup through parse, strip, URL policy, CSP, then safe preview or share</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="100%" stop-color="#0A1C30"/>
    </linearGradient>
    <marker id="arrowR" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7DD3FC"/>
    </marker>
    <marker id="arrowD" markerWidth="12" markerHeight="12" refX="4" refY="10" orient="auto">
      <path d="M0,0 L4,10 L8,0 Z" fill="#7DD3FC"/>
    </marker>
  </defs>
  <rect width="1000" height="720" fill="url(#bg2)"/>

  <text x="40" y="58" fill="#F8FAFC" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="700">Defense-in-depth sanitization pipeline</text>
  <text x="40" y="96" fill="#BAE6FD" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="20">Parse → strip → URL policy → CSP → preview / share</text>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <!-- Row 1 -->
    <rect x="40" y="130" width="280" height="150" rx="16" fill="#0B1F33" stroke="#F87171" stroke-width="3"/>
    <text x="64" y="192" fill="#FECACA" font-size="30" font-weight="700">1. Untrusted</text>
    <text x="64" y="236" fill="#F1F5F9" font-size="22">paste / upload</text>
    <text x="64" y="268" fill="#F1F5F9" font-size="22">/ share hash</text>

    <line x1="330" y1="205" x2="378" y2="205" stroke="#7DD3FC" stroke-width="3.5" marker-end="url(#arrowR)"/>

    <rect x="390" y="130" width="280" height="150" rx="16" fill="#0B1F33" stroke="#38BDF8" stroke-width="3"/>
    <text x="414" y="192" fill="#BAE6FD" font-size="30" font-weight="700">2. DOMParser</text>
    <text x="414" y="236" fill="#F1F5F9" font-size="22">image/svg+xml</text>
    <text x="414" y="268" fill="#F1F5F9" font-size="22">reject junk root</text>

    <line x1="680" y1="205" x2="728" y2="205" stroke="#7DD3FC" stroke-width="3.5" marker-end="url(#arrowR)"/>

    <rect x="740" y="130" width="220" height="150" rx="16" fill="#0B1F33" stroke="#FBBF24" stroke-width="3"/>
    <text x="764" y="192" fill="#FDE68A" font-size="28" font-weight="700">3. Strip</text>
    <text x="764" y="236" fill="#F1F5F9" font-size="22">tags, on*, SMIL</text>
    <text x="764" y="268" fill="#F1F5F9" font-size="22">CSS / URLs</text>

    <!-- Arrow down from strip -->
    <line x1="850" y1="290" x2="850" y2="338" stroke="#7DD3FC" stroke-width="3.5" marker-end="url(#arrowD)"/>

    <!-- Row 2 -->
    <rect x="40" y="360" width="440" height="130" rx="16" fill="#0B1F33" stroke="#34D399" stroke-width="3"/>
    <text x="64" y="418" fill="#A7F3D0" font-size="30" font-weight="700">4a. Safe preview</text>
    <text x="64" y="462" fill="#F1F5F9" font-size="22">Inspectable sanitized DOM</text>

    <rect x="520" y="360" width="440" height="130" rx="16" fill="#0B1F33" stroke="#22D3EE" stroke-width="3"/>
    <text x="544" y="418" fill="#CFFAFE" font-size="30" font-weight="700">4b. Share mode</text>
    <text x="544" y="462" fill="#F1F5F9" font-size="22">Strips phishing UI + remotes</text>

    <!-- Arrow down -->
    <line x1="500" y1="500" x2="500" y2="538" stroke="#7DD3FC" stroke-width="3.5" marker-end="url(#arrowD)"/>

    <!-- Row 3 CSP -->
    <rect x="40" y="550" width="920" height="100" rx="16" fill="#0B1F33" stroke="#A5F3FC" stroke-width="3"/>
    <text x="64" y="612" fill="#F0F9FF" font-size="28" font-weight="700">5. + CSP — script-src 'self' as a defense layer</text>
  </g>
</svg>
