<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" width="1400" height="720" role="img" aria-labelledby="title desc">
  <title id="title">SVG XSS attack surface map</title>
  <desc id="desc">Diagram of dangerous SVG surfaces: script, event handlers, foreignObject, SMIL, unsafe URLs, and CSS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061018"/>
      <stop offset="100%" stop-color="#0A1C30"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E2438"/>
      <stop offset="100%" stop-color="#0A1A2C"/>
    </linearGradient>
    <filter id="soft" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="1400" height="720" fill="url(#bg)"/>
  <rect x="40" y="36" width="1320" height="648" rx="22" fill="url(#card)" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2"/>
  <text x="72" y="100" fill="#F8FAFC" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="40" font-weight="700">SVG XSS attack surface</text>
  <text x="72" y="146" fill="#BAE6FD" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22">What untrusted markup can execute when you inline it</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" filter="url(#soft)">
    <rect x="72" y="188" width="400" height="200" rx="16" fill="#0B1F33" stroke="#F87171" stroke-width="2.5"/>
    <text x="100" y="240" fill="#FECACA" font-size="26" font-weight="700">&lt;script&gt; / on*</text>
    <text x="100" y="282" fill="#F1F5F9" font-size="20">Classic execution</text>
    <text x="100" y="316" fill="#E2E8F0" font-size="18">onclick, onload, onbegin…</text>
    <text x="100" y="348" fill="#E2E8F0" font-size="18">Runs in the page origin</text>

    <rect x="500" y="188" width="400" height="200" rx="16" fill="#0B1F33" stroke="#FBBF24" stroke-width="2.5"/>
    <text x="528" y="240" fill="#FDE68A" font-size="26" font-weight="700">foreignObject</text>
    <text x="528" y="282" fill="#F1F5F9" font-size="20">HTML island inside SVG</text>
    <text x="528" y="316" fill="#E2E8F0" font-size="18">iframe, form, nested HTML</text>
    <text x="528" y="348" fill="#E2E8F0" font-size="18">Bypasses SVG-only checks</text>

    <rect x="928" y="188" width="400" height="200" rx="16" fill="#0B1F33" stroke="#A78BFA" stroke-width="2.5"/>
    <text x="956" y="240" fill="#DDD6FE" font-size="26" font-weight="700">SMIL animate / set</text>
    <text x="956" y="282" fill="#F1F5F9" font-size="20">Mutate href to javascript:</text>
    <text x="956" y="316" fill="#E2E8F0" font-size="18">attributeName=href/style</text>
    <text x="956" y="348" fill="#E2E8F0" font-size="18">Easy to miss in allowlists</text>

    <rect x="72" y="420" width="400" height="200" rx="16" fill="#0B1F33" stroke="#38BDF8" stroke-width="2.5"/>
    <text x="100" y="472" fill="#BAE6FD" font-size="26" font-weight="700">Unsafe URLs</text>
    <text x="100" y="514" fill="#F1F5F9" font-size="20">javascript:, data:text/html</text>
    <text x="100" y="548" fill="#E2E8F0" font-size="18">nested data:image/svg+xml</text>
    <text x="100" y="580" fill="#E2E8F0" font-size="18">external &lt;use&gt; / remote image</text>

    <rect x="500" y="420" width="400" height="200" rx="16" fill="#0B1F33" stroke="#34D399" stroke-width="2.5"/>
    <text x="528" y="472" fill="#A7F3D0" font-size="26" font-weight="700">CSS active content</text>
    <text x="528" y="514" fill="#F1F5F9" font-size="20">@import, url(javascript:)</text>
    <text x="528" y="548" fill="#E2E8F0" font-size="18">expression(), -moz-binding</text>
    <text x="528" y="580" fill="#E2E8F0" font-size="18">&lt;style&gt; + style attributes</text>

    <rect x="928" y="420" width="400" height="200" rx="16" fill="#0B1F33" stroke="#22D3EE" stroke-width="2.5"/>
    <text x="956" y="472" fill="#CFFAFE" font-size="26" font-weight="700">Safer insert paths</text>
    <text x="956" y="514" fill="#F1F5F9" font-size="20">&lt;img&gt; / scrubbed DOM</text>
    <text x="956" y="548" fill="#E2E8F0" font-size="18">CSP + sanitizer + share mode</text>
    <text x="956" y="580" fill="#E2E8F0" font-size="18">Never raw innerHTML</text>
  </g>
</svg>
