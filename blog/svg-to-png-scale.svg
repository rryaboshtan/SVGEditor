<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="SVG 24x24 becomes a 48x48 PNG at 2x export">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#061018"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <pattern id="check" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#142536"/>
      <rect width="8" height="8" fill="#1a3044"/>
      <rect x="8" y="8" width="8" height="8" fill="#1a3044"/>
    </pattern>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect x="48" y="48" width="504" height="544" rx="20" fill="#0c1828" stroke="#1e3a52" stroke-width="2"/>
  <rect x="648" y="48" width="504" height="544" rx="20" fill="#0c1828" stroke="#1e3a52" stroke-width="2"/>
  <text x="72" y="92" fill="#6f89a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em">BEFORE - SVG SOURCE</text>
  <text x="672" y="92" fill="#6f89a8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.08em">AFTER - PNG @ 2x</text>
  <text x="72" y="140" fill="#9fb6d1" font-family="ui-monospace, monospace" font-size="20">viewBox="0 0 24 24" - 24x24</text>
  <text x="672" y="140" fill="#9fb6d1" font-family="ui-monospace, monospace" font-size="20">canvas 48x48 - transparent</text>
  <rect x="168" y="220" width="264" height="264" rx="12" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="8 6"/>
  <g transform="translate(240 292) scale(5)">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="url(#mark)" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="300" y="520" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="18">24 CSS px</text>
  <rect x="720" y="188" width="360" height="360" rx="12" fill="url(#check)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="2"/>
  <g transform="translate(780 248) scale(10)">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="none" stroke="url(#mark)" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="900" y="580" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="18">48 PNG px - alpha kept</text>
</svg>
